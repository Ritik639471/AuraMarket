name: auramarket

services:
  auramarket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auramarket-api
    restart: always
    ports:
      - "127.0.0.1:5003:5003"
    env_file:
      - .env
    environment:
      - PORT=5003
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5003/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
